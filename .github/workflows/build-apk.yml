# 云构建 APK：push 到 main 或手动触发。
# 签名用 frontend/android/fixed-debug.keystore（固定 debug key，保证每次构建
# 签名一致、可直接覆盖安装不丢数据）。自用分发，不走应用商店。
name: build-apk

on:
  push:
    branches: [main]
    paths: ['frontend/**', 'patches/**', '.github/workflows/**', 'android/fixed-debug.keystore']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # 固定 keystore 放到 AGP 默认 debug keystore 位置，release 构建即用它签名
      - name: Restore fixed debug keystore
        run: |
          mkdir -p ~/.android
          cp frontend/android/fixed-debug.keystore ~/.android/debug.keystore

      - name: Flutter version
        run: flutter --version

      - name: Pub get
        working-directory: frontend
        run: flutter pub get

      # 发布配置：关闭调试用的绑定 tab（原项目约定）
      - name: Build APKs
        working-directory: frontend
        run: flutter build apk --release --split-per-abi --dart-define=ENABLE_BIND_FLOW=false

      - name: Upload arm64 APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-arm64-v8a
          path: frontend/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk

      - name: Upload universal APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-universal
          path: frontend/build/app/outputs/flutter-apk/app-release.apk
